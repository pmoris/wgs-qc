module_order:
  - fastqc:
      name: "FastQC (trimmed)"
      anchor: "fastqc_trimmed"
      info: "This section of the report shows FastQC results after adapter trimming."
      target: ""
      path_filters:
        - "*trim_fastqc.zip"
  - fastqc:
      name: "FastQC (raw)"
      anchor: "fastqc_raw"
      path_filters:
        - "*R[1,2]_fastqc.zip"
        - "*_[1,2]_fastqc.zip"
plots_force_interactive: true

picard_config:
  s_name_filenames: true

fn_ignore_dirs:
  - "gatk"
  - "multiqc"
  - "snpeff"
  - "bwa-wrongspecies"
